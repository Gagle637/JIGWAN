services:
  db:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      # pg_dump 일일 백업은 추후 단계에서 추가(spec 9-4)
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: docker/images/django/Dockerfile
    # collectstatic은 빌드 시점엔 .env(DJANGO_SECRET_KEY 등)가 없어 못 돌리므로 시작 시점에 한다.
    command: sh -c "python manage.py collectstatic --noinput && gunicorn config.wsgi:application --bind 0.0.0.0:8000"
    env_file: .env
    environment:
      POSTGRES_HOST: db
      REDIS_URL: redis://redis:6379
      # CDSE S3(eodata) 접근용 GDAL 환경변수(6단계 결정 사항 5) — 지금은 boto3 download_file로만
      # 받고 있어 당장 쓰이진 않지만, 나중에 rasterio가 /vsis3/로 직접 읽을 때를 대비해 맞춰 둔다.
      AWS_S3_ENDPOINT: eodata.dataspace.copernicus.eu
      AWS_HTTPS: "YES"
      AWS_VIRTUAL_HOSTING: "FALSE"
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app/backend
      - ./data:/app/data:ro  # load_buildings/load_regions 관리 명령이 data/raw/*를 읽는다
      - ./data/satellite_scenes:/app/data/satellite_scenes  # 장면별 COG(90일 보관, 결과 COG와 다름)
      - ./docker/data/cog:/app/docker/data/cog  # run_season_chain 관리 명령이 여기 쓴다(7단계)
      - ./docker/data/crime_tiles:/app/docker/data/crime_tiles  # 범죄주의구간 WMS 타일 캐시(9단계)
    # extra_hosts로 host.docker.internal:host-gateway를 넣어봤는데(리눅스 호환 의도),
    # Docker Desktop(Windows/Mac)은 이미 이 이름을 기본 제공해서 중복 항목(그중 IPv6는
    # 연결 자체가 안 됨)이 생겨 오히려 이름 해석이 깨지는 걸 실측했다(worker-gpu의 Ollama
    # 호출이 "No address associated with hostname"으로 실패). Docker Desktop에서는 빼고,
    # 네이티브 리눅스 Docker Engine에 배포할 때만 다시 추가한다.
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health"]
      interval: 10s
      timeout: 5s
      retries: 10

  worker-io:
    build:
      context: .
      dockerfile: docker/images/django/Dockerfile
    command: celery -A config worker -Q io -n worker-io@%h --loglevel=info
    env_file: .env
    environment:
      POSTGRES_HOST: db
      REDIS_URL: redis://redis:6379
      AWS_S3_ENDPOINT: eodata.dataspace.copernicus.eu
      AWS_HTTPS: "YES"
      AWS_VIRTUAL_HOSTING: "FALSE"
    volumes:
      - ./backend:/app/backend
      - ./data/satellite_scenes:/app/data/satellite_scenes
      - ./docker/data/crime_tiles:/app/docker/data/crime_tiles  # safety_sync가 끝나면 여기를 비운다
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  worker-cpu:
    build:
      context: .
      dockerfile: docker/images/django/Dockerfile
    command: celery -A config worker -Q cpu -n worker-cpu@%h --loglevel=info
    env_file: .env
    environment:
      POSTGRES_HOST: db
      REDIS_URL: redis://redis:6379
      AWS_S3_ENDPOINT: eodata.dataspace.copernicus.eu
      AWS_HTTPS: "YES"
      AWS_VIRTUAL_HOSTING: "FALSE"
    volumes:
      - ./backend:/app/backend
      - ./data/satellite_scenes:/app/data/satellite_scenes
      - ./docker/data/cog:/app/docker/data/cog  # 계절 합성 결과 COG(영구) — TiTiler와 같은 디렉터리를 쓴다
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  worker-gpu:
    build:
      context: .
      dockerfile: docker/images/django/Dockerfile
    # 리포트 생성 큐. vLLM/Ollama를 호출만 하므로 이 워커 자체는 GPU가 필요 없다(spec 9-4).
    # --pool=solo: 기본 prefork는 자식 프로세스를 fork로 미리 띄우는데, Docker Desktop의
    # host.docker.internal DNS 해석이 그 fork된 자식 프로세스에서만 깨지는 걸 실측했다
    # (docker compose exec로 새로 띄운 프로세스는 매번 멀쩡했음 — fork 이후 DNS 리졸버
    # 상태가 안 이어지는 문제로 보인다). LLM 호출은 I/O 대기라 병렬 프로세스가 필요 없다.
    command: celery -A config worker -Q gpu -n worker-gpu@%h --pool=solo --loglevel=info
    env_file: .env
    environment:
      POSTGRES_HOST: db
      REDIS_URL: redis://redis:6379
    volumes:
      - ./backend:/app/backend
    # extra_hosts(host.docker.internal:host-gateway)는 뺐다 — api 서비스 주석 참고(Docker
    # Desktop에서 중복 항목으로 이름 해석이 깨지는 걸 실측했다).
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  beat:
    build:
      context: .
      dockerfile: docker/images/django/Dockerfile
    # Celery Beat는 단일 인스턴스만 실행한다(spec 9-4).
    command: celery -A config beat --loglevel=info --scheduler django_celery_beat.schedulers:DatabaseScheduler
    env_file: .env
    environment:
      POSTGRES_HOST: db
      REDIS_URL: redis://redis:6379
    volumes:
      - ./backend:/app/backend
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  titiler:
    image: ghcr.io/developmentseed/titiler:0.18.6
    ports:
      - "8001:8000"
    volumes:
      - ./docker/data/cog:/data/cog:ro
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/healthz"]
      interval: 10s
      timeout: 5s
      retries: 10

  # NVIDIA GPU가 있을 때만 쓰는 선택지(기본은 로컬 Ollama, LLM_BASE_URL로 전환).
  # docker compose --profile llm up -d vllm 로 띄우고 .env를 vLLM 쪽 값으로 바꾼다.
  vllm:
    image: vllm/vllm-openai:v0.32.0
    command: --model openai/gpt-oss-20b
    ports:
      - "8002:8000"
    volumes:
      - vllm-cache:/root/.cache/huggingface
    profiles: ["llm"]  # 기본 `docker compose up`에는 포함되지 않음

volumes:
  pgdata:
  vllm-cache:
